<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Principal Login — Teacher Appraisal System</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">📋 Teacher Appraisal System</a>
  <div class="who" id="topbar-who"></div>
</header>

<div class="wrap narrow">
  <a class="back-link" href="/index.html">← Home</a>
  <div class="card" style="margin-top:14px;">
    <h1>Principal Login</h1>
    <p class="lede">Default password is <code>principal123</code> the first time you run this app — change it from the dashboard after logging in.</p>
    <div class="error-msg" id="err"></div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" />
    </div>
    <div class="btn-row">
      <button class="btn orange" id="login-btn">Log in</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const err = document.getElementById("err");
document.getElementById("login-btn").addEventListener("click", async () => {
  hideError(err);
  const password = document.getElementById("password").value;
  try {
    await api("/api/principal/login", { method: "POST", body: JSON.stringify({ password }) });
    window.location.href = "/principal-dashboard.html";
  } catch (e) {
    showError(err, e.message);
  }
});
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});
</script>
</body>
</html>
