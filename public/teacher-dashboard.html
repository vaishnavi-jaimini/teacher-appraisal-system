<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Dashboard — Teacher Appraisal System</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">📋 Teacher Appraisal System</a>
  <div class="who" id="topbar-who"></div>
</header>

<div class="wrap">
  <a class="back-link" href="/index.html">← Home</a>
  <div class="card" style="margin-top:14px;">
    <h1 id="title">My Dashboard</h1>
    <p class="lede" id="lede">Complete your self-appraisal, then check back here once your principal has reviewed it.</p>
    <div class="error-msg" id="err"></div>

    <div class="stat-row" id="info-row"></div>

    <div id="callout"></div>

    <div class="btn-row">
      <a class="btn" id="grade-btn" href="/teacher-grade.html">Grade Yourself</a>
      <a class="btn secondary" id="results-btn" href="#" style="display:none;">View My Results</a>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(async function () {
  const session = await requireRole("teacher");
  if (!session) return;

  const err = document.getElementById("err");
  try {
    const me = await api("/api/teacher/me");
    const t = me.teacher;
    document.getElementById("title").textContent = `Welcome, ${t.name}`;

    document.getElementById("info-row").innerHTML = `
      <div class="stat-tile"><div class="stat-label">Department</div><div class="stat-value" style="font-size:16px;">${escapeHtml(t.department || "—")}</div></div>
      <div class="stat-tile"><div class="stat-label">Section</div><div class="stat-value" style="font-size:16px;">${escapeHtml(t.section || "—")}</div></div>
      <div class="stat-tile"><div class="stat-label">Self-Appraisal</div><div class="stat-value" style="font-size:16px;">${me.selfRating ? `<span class="badge done">Submitted</span>` : `<span class="badge pending">Pending</span>`}</div></div>
      <div class="stat-tile"><div class="stat-label">Principal Review</div><div class="stat-value" style="font-size:16px;">${me.principalDone ? `<span class="badge done">Submitted</span>` : `<span class="badge pending">Pending</span>`}</div></div>
    `;

    document.getElementById("grade-btn").textContent = me.selfRating ? "Edit My Grading" : "Grade Yourself";

    if (me.principalDone) {
      document.getElementById("callout").innerHTML =
        `<div class="pin-callout">Your principal has completed your appraisal review. View your results below.</div>`;
      const resultsBtn = document.getElementById("results-btn");
      resultsBtn.href = `/comparison.html?teacherId=${t.id}`;
      resultsBtn.style.display = "";
    } else if (!me.selfRating) {
      document.getElementById("callout").innerHTML =
        `<div class="pin-callout">You haven't started your self-appraisal yet. Click <strong>Grade Yourself</strong> to begin.</div>`;
    }
  } catch (e) {
    showError(err, e.message);
  }
})();
</script>
</body>
</html>
