<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — Teacher Appraisal System</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">📋 Teacher Appraisal System</a>
  <div class="who" id="topbar-who"></div>
</header>

<div class="wrap narrow">
  <a class="back-link" href="/teacher-login.html">← Back to login</a>
  <div class="card" style="margin-top:14px;">
    <h1>Reset Your Password</h1>
    <p class="lede" id="step1-lede">Enter the email you registered with. We'll send a one-time code to reset your password.</p>
    <div class="error-msg" id="err"></div>
    <div class="success-msg" id="success"></div>

    <div id="step1">
      <div class="field">
        <label>Email</label>
        <input type="text" id="email" placeholder="e.g. asha.verma@example.com" autocomplete="email" />
      </div>
      <div class="btn-row">
        <button class="btn" id="send-otp-btn">Send reset code</button>
      </div>
    </div>

    <div id="step2" style="display:none;">
      <div class="field">
        <label>6-digit code</label>
        <input type="text" id="otp" placeholder="123456" autocomplete="one-time-code" inputmode="numeric" />
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" />
      </div>
      <div class="btn-row">
        <button class="btn" id="reset-btn">Reset password</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(function () {
  const err = document.getElementById("err");
  const success = document.getElementById("success");
  let savedEmail = "";

  document.getElementById("send-otp-btn").addEventListener("click", async () => {
    hideError(err);
    success.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    if (!email) return showError(err, "Enter your email.");
    try {
      await api("/api/teacher/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
      savedEmail = email;
      success.textContent = "If that email is registered, a reset code has been sent. Ask your admin if you don't receive it — it may have been logged on the server instead of emailed.";
      success.classList.add("show");
      document.getElementById("step1").style.display = "none";
      document.getElementById("step2").style.display = "";
    } catch (e) {
      showError(err, e.message);
    }
  });

  document.getElementById("reset-btn").addEventListener("click", async () => {
    hideError(err);
    const otp = document.getElementById("otp").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (!otp) return showError(err, "Enter the code sent to your email.");
    if (!newPassword || newPassword.length < 4) return showError(err, "New password must be at least 4 characters.");
    if (newPassword !== confirmPassword) return showError(err, "Passwords do not match.");
    try {
      await api("/api/teacher/reset-password", { method: "POST", body: JSON.stringify({ email: savedEmail, otp, newPassword }) });
      window.location.href = "/teacher-login.html";
    } catch (e) {
      showError(err, e.message);
    }
  });
})();
</script>
</body>
</html>
