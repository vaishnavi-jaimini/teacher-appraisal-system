<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher Login — Teacher Appraisal System</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/index.html">📋 Teacher Appraisal System</a>
  <div class="who" id="topbar-who"></div>
</header>

<div class="wrap narrow">
  <a class="back-link" href="/index.html">← Home</a>
  <div class="card" style="margin-top:14px;">
    <h1>Teacher Login</h1>
    <p class="lede">Enter your name and password to continue.</p>
    <div class="error-msg" id="err"></div>

    <div class="field">
      <label>Your name</label>
      <input type="text" id="name" placeholder="e.g. Asha Verma" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <div class="btn-row">
      <button class="btn" id="login-btn">Log in</button>
    </div>
    <p class="secondary-text" style="margin-top:18px; font-size:13.5px;">
      First time here? <a href="/teacher-register.html">Register for an account</a><br/>
      Forgot your password? <a href="/teacher-forgot-password.html">Reset it</a>
    </p>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(function () {
  const err = document.getElementById("err");

  document.getElementById("login-btn").addEventListener("click", async () => {
    hideError(err);
    const name = document.getElementById("name").value.trim();
    const password = document.getElementById("password").value;
    if (!name || !password) return showError(err, "Enter your name and password.");
    try {
      await api("/api/teacher/login", { method: "POST", body: JSON.stringify({ name, password }) });
      window.location.href = "/teacher-dashboard.html";
    } catch (e) {
      showError(err, e.message);
    }
  });

  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });
})();
</script>
</body>
</html>
